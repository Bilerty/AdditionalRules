ruleset=🛸 Antigravity and Vertex,https://cdn.jsdelivr.net/gh/Bilerty/AdditionalRules/srcRules/Antigravity.list
ruleset=⭕ Oracle, https://cdn.jsdelivr.net/gh/Bilerty/AdditionalRules/srcRules/Oracle.list
